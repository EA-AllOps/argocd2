apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: allops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EA-AllOps/argocd2.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: allops
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
